name: Build Android APK

on:
  push:
    branches: [agent-hub]
    paths-ignore: ["apk/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AgentHub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hub-apk
          path: AgentHub.apk
      - name: Publish as a release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete agent-hub-latest --yes --cleanup-tag || true
          gh release create agent-hub-latest AgentHub.apk --target "${{ github.sha }}" \
            --title "Agent Hub (latest build)" --notes "Built from ${{ github.sha }}" --prerelease
      - name: Store the APK on the agent-hub-build branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp AgentHub.apk /tmp/out/
          git checkout --orphan agent-hub-build
          git rm -rfq . && git clean -fdq
          cp /tmp/out/AgentHub.apk .
          git add AgentHub.apk && git commit -qm "APK from ${{ github.sha }}"
          git push -f origin agent-hub-build
